version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: oncosense_postgres

    environment:
      POSTGRES_DB: oncosense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: oncosense_mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: