name: Apply iOS font fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix SwiftUI tracking modifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/OncoSense/OncoSenseApp.swift')
          s = p.read_text()
          old = 'Text("ONCOSENSE").font(.headline.bold().tracking(2))'
          new = 'Text("ONCOSENSE").font(.headline.bold()).tracking(2)'
          if old not in s:
              raise SystemExit('Target line not found; stopping without changes.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/OncoSense/OncoSenseApp.swift
          git commit -m 'fix: correct SwiftUI tracking modifier'
          git push
