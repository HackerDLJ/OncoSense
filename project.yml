name: OncoSense
options:
  bundleIdPrefix: com.hackerdlj
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Xcode 26+ treats the modern watchOS app as a Foundation-style embedded
  # product. XcodeGen still generates the legacy Watch/ destination by
  # default, so move the embedded watch product into PlugIns/ after generation.
  postGenCommand: >-
    sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|'
    -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|'
    OncoSense.xcodeproj/project.pbxproj
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 210
    MARKETING_VERSION: 2.0.2
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  OncoSense:
    type: application
    platform: iOS
    sources:
      - path: ios/OncoSense
      - path: Shared/OncoSenseCore
    dependencies:
      # The watch product must be an embedded dependency of the iPhone app.
      # This is what lets Xcode package the watchOS product with the iOS build.
      - target: OncoSenseWatch
        embed: true
    info:
      path: ios/OncoSense/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerdlj.oncosense
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: OncoSense
        INFOPLIST_KEY_NSHealthShareUsageDescription: "OncoSense reads your authorized Health data to build a personal physiological baseline and monitor persistent changes over time."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "OncoSense does not write health data."
        CODE_SIGN_ENTITLEMENTS: ios/OncoSense/OncoSense.entitlements
        SUPPORTS_MACCATALYST: false

  OncoSenseWatch:
    type: application
    platform: watchOS
    sources:
      - path: watchOS/OncoSenseWatch
      - path: Shared/OncoSenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerdlj.oncosense.watchkitapp
        PRODUCT_NAME: OncoSenseWatch
        INFOPLIST_KEY_CFBundleDisplayName: OncoSense
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.hackerdlj.oncosense
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApplication: false
        INFOPLIST_KEY_NSHealthShareUsageDescription: "OncoSense reads your authorized Health data to build a personal physiological baseline and monitor persistent changes over time."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "OncoSense does not write health data."
        CODE_SIGN_ENTITLEMENTS: watchOS/OncoSenseWatch/OncoSenseWatch.entitlements

schemes:
  OncoSense:
    build:
      targets:
        # Build both products when the iPhone scheme is run. This prevents the
        # physical iPhone install from being a phone-only build and makes the
        # paired Watch product part of the same Xcode run workflow.
        OncoSense: all
        OncoSenseWatch: all
    run:
      config: Debug
      executable: OncoSense
    test:
      config: Debug
      targets: []
    profile:
      config: Release
      executable: OncoSense
    archive:
      config: Release
  OncoSenseWatch:
    build:
      targets:
        OncoSenseWatch: all
    run:
      config: Debug
      executable: OncoSenseWatch
    test:
      config: Debug
      targets: []
    profile:
      config: Release
      executable: OncoSenseWatch
    archive:
      config: Release
