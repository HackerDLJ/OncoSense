name: OncoSense
options:
  bundleIdPrefix: com.hackerdlj
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 204
    MARKETING_VERSION: 2.0.0
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  OncoSense:
    type: application
    platform: iOS
    sources:
      - path: ios/OncoSense
      - path: Shared/OncoSenseCore
    dependencies:
      - target: OncoSenseWatch
    info:
      path: ios/OncoSense/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerdlj.oncosense
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: OncoSense
        INFOPLIST_KEY_NSHealthShareUsageDescription: "OncoSense uses your authorized health data to build a personal physiological baseline and identify persistent changes."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "OncoSense does not write health data."
        SUPPORTS_MACCATALYST: false

  OncoSenseWatch:
    type: application
    platform: watchOS
    sources:
      - path: watchOS/OncoSenseWatch
      - path: Shared/OncoSenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerdlj.oncosense.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: OncoSense
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.hackerdlj.oncosense
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApplication: false
        INFOPLIST_KEY_NSHealthShareUsageDescription: "OncoSense uses your authorized health data to build a personal physiological baseline and identify persistent changes."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "OncoSense does not write health data."
        CODE_SIGN_ENTITLEMENTS: watchOS/OncoSenseWatch/OncoSenseWatch.entitlements

schemes:
  OncoSense:
    build:
      targets:
        OncoSense: all
        OncoSenseWatch: all
    run:
      config: Debug
      executable: OncoSense
    test:
      config: Debug
      targets: []
    profile:
      config: Release
      executable: OncoSense
    archive:
      config: Release
  OncoSenseWatch:
    build:
      targets:
        OncoSenseWatch: all
    run:
      config: Debug
      executable: OncoSenseWatch
    test:
      config: Debug
      targets: []
    profile:
      config: Release
      executable: OncoSenseWatch
    archive:
      config: Release
